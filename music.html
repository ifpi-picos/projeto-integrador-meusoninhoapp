<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicas</title>
    <link rel="shortcut icon" href="assets/favicons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json" />
    <script defer src="js/index.js"></script>
    <script defer src="js/music.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="body-home">
  <header>
    <div class="menu-hamburguer">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="line3"></div>
    </div>
    <a href="index.html" class="meio-header">
      <img src="assets/logo.png" alt="Logo do Site">
      <h1>Meu Soninho</h1>
    </a>
    <img src="assets/UserIcon.svg" alt="Foto de Perfil" class="user-icon-home">
  </header>
  <div class="page">
    <nav class="nav-home">
      <img class="foto-perfil-home" src="assets/UserIcon.svg" alt="Foto de Perfil">
      <a href="index.html"><img src="assets/NavIcons/HomeIcon.png" alt="Início"><span>Início</span></a>
      <a href="alarm.html"><img src="assets/NavIcons/AlarmIcon.png" alt="Alarme"><span>Alarme</span></a>
      <a style="background-color: var(--cor-contraste);" href="music.html"><img src="assets/NavIcons/MusicIcon.png" alt="Música"><span>Músicas</span></a>
      <a href="rank.html"><img src="assets/NavIcons/RankIcon.png" alt="Ranking"><span>Ranking</span></a>
      <a href="plan.html"><img src="assets/NavIcons/PlanIcon.png" alt="Plano"><span>Plano</span></a>
      <a href="stats.html"><img src="assets/NavIcons/StatsIcon.png" alt="Estatísticas"><span>Estatísticas</span></a>
      <a href="config.html"><img src="assets/NavIcons/ConfigIcon.png" alt="Configurações"><span>Configurações</span></a>
    </nav>

    <main>
        <div class="nina-music"></div>
        <div id="container-music">
            <section>
                <div class="tab-music-buttons">
                    <button class="tab-music-btn active" content-id="musica-classica"> 
                        Música Clássica
                    </button>
                    <button class="tab-music-btn" content-id="lo-fi">
                        Lo-Fi
                    </button>
                    <button class="tab-music-btn" content-id="som-ambiente">
                        Som Ambiente
                    </button>
                    <button class="tab-music-btn" content-id="jazz-suave">
                        Jazz Suave
                    </button>
                    <button class="tab-music-btn" content-id="ruidos">
                        Ruídos
                    </button>
                </div>
                <section class="tab-music-contents">
                    <div class="content-music" id="musica-classica"></div>
                    <div class="content-music" id="lo-fi"></div>
                    <div class="content-music" id="som-ambiente"></div>
                    <div class="content-music" id="jazz-suave"></div>
                    <div class="content-music" id="ruidos"></div>
                </section>
            </section>
            <div class="music-player">
                <div id="now-playing"></div>
                <audio id="audio-player" controls>
                    <source src="" type="audio/mpeg">
                    Seu navegador não suporta o elemento de áudio.
                </audio>
            </div>
        </div>
    </main>
  </div>
</body>

</html>
