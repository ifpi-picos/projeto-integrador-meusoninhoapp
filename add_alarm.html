<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Alarme</title>
    <link rel="shortcut icon" href="assets/favicons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/alarm.js"></script>
</head>
<body class="body-home">
  <header>
    <div class="menu-hamburguer">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="line3"></div>
    </div>
    <a href="index.html" class="meio-header">
      <img src="assets/logo.png" alt="Logo do Site">
      <h1>Meu Soninho</h1>
    </a>
    <a href="login.html" class="logout" ><img src="assets/logout-icon.png" alt="Foto do perfil"></a>
  </header>
  <div class="page">
    <nav class="nav-home">
      <img class="foto-perfil-home" src="assets/UserIcon.svg" alt="Foto de Perfil">
      <a href="index.html"><img src="assets/NavIcons/HomeIcon.png" alt="Início"><span>Início</span></a>
      <a href="alarm.html"><img src="assets/NavIcons/AlarmIcon.png" alt="Alarme"><span>Alarme</span></a>
      <a href="music.html"><img src="assets/NavIcons/MusicIcon.png" alt="Música"><span>Músicas</span></a>
      <a href="rank.html"><img src="assets/NavIcons/RankIcon.png" alt="Ranking"><span>Ranking</span></a>
      <a href="plan.html"><img src="assets/NavIcons/PlanIcon.png" alt="Plano"><span>Plano</span></a>
      <a href="stats.html"><img src="assets/NavIcons/StatsIcon.png" alt="Estatísticas"><span>Estatísticas</span></a>
      <a href="config.html"><img src="assets/NavIcons/ConfigIcon.png" alt="Configurações"><span>Configurações</span></a>
    </nav>
    <main>
      <div class="container">
        <h2>Adicionar Novo Alarme</h2>

        <form id="addAlarmForm">
          <label for="alarmTime">Hora do Alarme</label>
          <input type="time" id="alarmTime" name="alarmTime" required>
          
          <label for="alarmLabel">Nome do Alarme (opcional)</label>
          <input type="text" id="alarmLabel" name="alarmLabel" placeholder="Ex: Acordar para trabalhar">
         

          <label>Repetir</label>
          <div class="repeat-days">
            <button type="button" class="day" id="day-dom" data-day="Dom">D</button>
            <button type="button" class="day" id="day-seg" data-day="Seg">S</button>
            <button type="button" class="day" id="day-ter" data-day="Ter">T</button>
            <button type="button" class="day" id="day-qua" data-day="Qua">Q</button>
            <button type="button" class="day" id="day-qui" data-day="Qui">Q</button>
            <button type="button" class="day" id="day-sex" data-day="Sex">S</button>
            <button type="button" class="day" id="day-sab" data-day="Sáb">S</button>
          </div>

          <button class="button-alarm" type="submit">Adicionar Alarme</button>
        </form>

        <button class="button-alarm" id="backBtn">Voltar</button>
      </div>
    </main>
  </div>
</body>
</html>
